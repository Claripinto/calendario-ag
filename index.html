<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Calendario agende</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<meta name="theme-color" content="#1d5a86">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
/* Layout: barra titolo + schede in alto; calendario mensile a griglia, pannello di selezione sotto, schede di controllo a elenco. */
:root{
  --bg:#f2f5f7; --surface:#ffffff; --surface2:#e9eef2; --ink:#16212b; --muted:#566676; --line:#d5dde4;
  --accent:#0a6a6a; --accent-ink:#ffffff; --sel:#cfeeee;
  --ok:#17794a; --ok-bg:#e4f3ea; --warn:#9a5200; --warn-bg:#fff1dc; --bad:#b3261e; --bad-bg:#fcebe9; --info:#31526f; --info-bg:#e6eef6;
  --t-formazione:#0b6e99;--t-ferie:#2f6db5; --t-feriep:#1f8a9e; --t-visita:#b5651d; --t-lutto:#5c5c6e; --t-recupero:#8a6d1f; --t-fest:#7a4fb0; --t-permesso:#0f7f7f; --t-congresso:#4a55c4; --t-l104:#b2467d; --t-nc:#6b7886;
  --t-malattia:#b3261e; --t-guasto:#c2641a; --t-struttura:#9a3412; --t-materiale:#a16207; --t-riprog:#2f7d4a;
  --font-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif; --font-mono:"IBM Plex Mono",ui-monospace,Menlo,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#10171d; --surface:#18222b; --surface2:#202c37; --ink:#e7edf2; --muted:#9aaab8; --line:#2c3a47;
    --accent:#4fc3c3; --accent-ink:#06201f; --sel:#1d4a4a;
    --ok:#5ad39a; --ok-bg:#16322a; --warn:#f0b061; --warn-bg:#3a2a12; --bad:#ff8c84; --bad-bg:#3d1d1b; --info:#8fb8de; --info-bg:#1b2c3b;
    --t-formazione:#5fb7e5;--t-ferie:#6ea6ec; --t-feriep:#6cc3d2; --t-visita:#e0a060; --t-lutto:#a9a9bd; --t-recupero:#d6c060; --t-fest:#b390e6; --t-permesso:#4fc3c3; --t-congresso:#8c97f0; --t-l104:#e283b2; --t-nc:#9aa8b6;
    --t-malattia:#ff8c84; --t-guasto:#f0a263; --t-struttura:#f08f67; --t-materiale:#e3b94f; --t-riprog:#6fcf8c;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#10171d; --surface:#18222b; --surface2:#202c37; --ink:#e7edf2; --muted:#9aaab8; --line:#2c3a47;
  --accent:#4fc3c3; --accent-ink:#06201f; --sel:#1d4a4a;
  --ok:#5ad39a; --ok-bg:#16322a; --warn:#f0b061; --warn-bg:#3a2a12; --bad:#ff8c84; --bad-bg:#3d1d1b; --info:#8fb8de; --info-bg:#1b2c3b;
  --t-formazione:#5fb7e5;--t-ferie:#6ea6ec; --t-feriep:#6cc3d2; --t-visita:#e0a060; --t-lutto:#a9a9bd; --t-recupero:#d6c060; --t-fest:#b390e6; --t-permesso:#4fc3c3; --t-congresso:#8c97f0; --t-l104:#e283b2; --t-nc:#9aa8b6;
  --t-malattia:#ff8c84; --t-guasto:#f0a263; --t-struttura:#f08f67; --t-materiale:#e3b94f; --t-riprog:#6fcf8c;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 var(--font-body);-webkit-text-size-adjust:100%}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.wrap{max-width:980px;margin:0 auto;padding:0 16px 48px}
header.top{padding:16px 0 8px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:baseline;justify-content:space-between}
header.top h1{margin:0;font-size:20px;font-weight:600;letter-spacing:.1px}
header.top .sub{color:var(--muted);font-size:13px}
.save{font-size:12px;color:var(--muted);font-family:var(--font-mono)}
nav.tabs{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;position:sticky;top:0;background:var(--bg);z-index:5;scrollbar-width:thin}
nav.tabs button{flex:0 0 auto;border:1px solid var(--line);background:var(--surface);padding:8px 14px;border-radius:999px;cursor:pointer;font-weight:500;color:var(--muted)}
nav.tabs button[aria-selected="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
h2{font-size:17px;margin:20px 0 8px;font-weight:600}
h3{font-size:15px;margin:0 0 6px;font-weight:600}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:14px;margin:10px 0}
.hint{color:var(--muted)}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grow{flex:1 1 auto}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 12px;cursor:pointer;font-weight:500}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:4px 10px;font-size:13px}
.btn:disabled{opacity:.5;cursor:default}
.mono{font-family:var(--font-mono)}
/* banner e chip */
.banner{border-radius:10px;padding:10px 12px;margin:10px 0;font-size:14px}
.banner.warn{background:var(--warn-bg);color:var(--warn)}
.banner.info{background:var(--info-bg);color:var(--info)}
.banner.bad{background:var(--bad-bg);color:var(--bad)}
.chip{display:inline-block;font-size:11px;font-weight:600;border-radius:6px;padding:1px 7px;letter-spacing:.2px;text-transform:uppercase}
.chip.ok{background:var(--ok-bg);color:var(--ok)} .chip.warn{background:var(--warn-bg);color:var(--warn)}
.chip.bad{background:var(--bad-bg);color:var(--bad)} .chip.info{background:var(--info-bg);color:var(--info)}
/* calendario */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:6px 0}
.calhead .title{font-size:18px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.dow{font-size:12px;color:var(--muted);text-align:center;padding:2px 0;font-weight:500}
.cell{position:relative;min-height:56px;border:1px solid var(--line);border-radius:8px;background:var(--surface);padding:4px;text-align:left;cursor:pointer;display:flex;flex-direction:column;justify-content:space-between;overflow:hidden}
.cell.empty{border:none;background:transparent;cursor:default}
.cell .dn{font-size:14px;font-weight:600}
.cell.wk{background:var(--surface2);color:var(--muted)}
.cell:disabled{cursor:default;opacity:.7}
.cell.hol{background:var(--bad-bg)} .cell.hol .dn{color:var(--bad)}
.cell.out{opacity:.55}
.cell.sel{outline:2px solid var(--accent);outline-offset:-2px;background:var(--sel)}
.cell .hl{font-size:10px;color:var(--bad);line-height:1}
.cell .bk{position:absolute;top:5px;right:5px;width:8px;height:8px;border-radius:50%;background:var(--warn)}
.badge{display:inline-block;align-self:flex-start;font-size:11px;font-weight:700;color:#fff;border-radius:5px;padding:0 5px;line-height:16px;font-family:var(--font-mono)}
.t-formazione{--c:var(--t-formazione)} .t-ferie{--c:var(--t-ferie)} .t-feriep{--c:var(--t-feriep)} .t-visita{--c:var(--t-visita)} .t-lutto{--c:var(--t-lutto)} .t-recupero{--c:var(--t-recupero)} .t-fest{--c:var(--t-fest)} .t-permesso{--c:var(--t-permesso)} .t-congresso{--c:var(--t-congresso)}
.t-l104{--c:var(--t-l104)} .t-nc{--c:var(--t-nc)} .t-malattia{--c:var(--t-malattia)} .t-guasto{--c:var(--t-guasto)}
.t-struttura{--c:var(--t-struttura)} .t-materiale{--c:var(--t-materiale)} .t-riprog{--c:var(--t-riprog)}
.badge{background:var(--c)}
:root[data-theme="dark"] .badge{color:#0b1218}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .badge{color:#0b1218}}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;color:var(--muted);margin:8px 0}
.legend span{display:inline-flex;gap:5px;align-items:center}
.tgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin:8px 0}
.tbtn{display:flex;gap:8px;align-items:center;text-align:left;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:6px 8px;cursor:pointer}
.tbtn small{display:block;color:var(--muted);font-size:11px}
.tbtn .badge{flex:0 0 auto}
/* verdetti */
.verdicts{list-style:none;margin:8px 0 0;padding:0;display:grid;gap:6px}
.verdicts li{display:flex;gap:8px;align-items:flex-start;font-size:14px}
.verdicts .chip{flex:0 0 auto;margin-top:2px;min-width:78px;text-align:center}
.range{display:flex;flex-wrap:wrap;gap:6px 12px;align-items:baseline;margin-bottom:4px}
.range .dates{font-family:var(--font-mono);font-weight:500}
.motiv{background:var(--surface2);border-radius:8px;padding:8px 10px;margin-top:8px;font-size:13px}
/* barre */
.bar{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--ok)}
.bar.warn>i{background:var(--warn)} .bar.bad>i{background:var(--bad)}
.counter{display:grid;grid-template-columns:150px 1fr auto;gap:10px;align-items:center;margin:8px 0}
@media (max-width:520px){.counter{grid-template-columns:1fr;gap:4px}}
table.simple{border-collapse:collapse;width:100%;font-size:14px}
table.simple th,table.simple td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;vertical-align:top}
.scroll{overflow-x:auto}
/* campi */
label.f{display:grid;gap:4px;font-size:13px;color:var(--muted);margin:8px 0}
input[type=text],input[type=date],input[type=number],select,textarea{width:100%;border:1px solid var(--line);background:var(--surface);border-radius:8px;padding:8px 10px;color:var(--ink)}
.cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:0 14px}
/* modulo */
.paper{background:#fff;color:#111;border:1px solid #bbb;border-radius:6px;padding:18px;font-family:"Times New Roman",Times,serif;font-size:14px}
.paper h4{text-align:center;font-size:18px;margin:6px 0 10px}
.paper .meta{display:flex;justify-content:space-between;font-size:13px;margin-bottom:8px;gap:8px;flex-wrap:wrap}
.paper table{border-collapse:collapse;width:100%;margin:4px 0 14px}
.paper th,.paper td{border:1px solid #111;padding:3px 6px;font-size:13px;vertical-align:top}
.paper th{text-align:center;font-weight:700}
.paper .lab{font-weight:700;margin:6px 0 2px}
.paper .sig{display:flex;justify-content:space-between;gap:20px;margin-top:18px;flex-wrap:wrap}
.paper .sig div{min-width:200px}
.paper .line{border-bottom:1px solid #111;height:22px;margin-top:2px}
.paper .stamp{font-size:12px;text-align:center;margin:10px auto;max-width:300px}
.paper .reasons{font-size:12px}
.draft{font-size:12px;color:#8a4b00;background:#fff3e0;border-radius:4px;padding:2px 8px;display:inline-block;font-family:var(--font-body)}
/* congressi */
.cg{display:grid;gap:4px}
.cg .meta{font-size:13px;color:var(--muted)}
a{color:var(--accent)}
.pick{position:fixed;left:0;right:0;bottom:0;z-index:15;background:var(--surface);border-top:2px solid var(--accent);padding:8px 12px calc(8px + env(safe-area-inset-bottom));box-shadow:0 -4px 16px rgba(0,0,0,.15)}
.pick .in{max-width:980px;margin:0 auto}
@media (min-width:1000px){
  .wrap{max-width:1400px}
  .calx{display:grid;grid-template-columns:minmax(0,1fr) 400px;gap:20px;align-items:start}
  .calside{position:sticky;top:8px;max-height:calc(100vh - 16px);overflow:auto;display:flex;flex-direction:column;gap:10px;padding-right:2px}
  .calside>div[style*="height:120px"]{display:none}
  .calside .pick{position:static;order:-1;border:1px solid var(--line);border-radius:10px;box-shadow:none;padding:10px}
  .calside .pick .in{max-width:none}
  .calside .pick .sc{flex-wrap:wrap;overflow:visible}
}
.pick .lbl{font-size:13px;margin-bottom:6px}
.pick .sc{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.pick .tbtn{flex:0 0 auto;padding:6px 10px}
.tbtn:disabled{opacity:.55;cursor:default}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:14px;z-index:20;max-width:90vw}
textarea.manual{height:140px;font-family:var(--font-mono);font-size:12px}
@media (prefers-reduced-motion:no-preference){.cell,.btn,.tbtn{transition:background .12s,border-color .12s}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div>
      <h1>Calendario agende</h1>
      <div class="sub">Sospensioni dell'ambulatorio, motivazioni e spettanze in un solo posto · versione 28</div>
    </div>
    <div class="save" id="saveStatus" role="status"></div>
  </header>
  <nav class="tabs" id="tabs" role="tablist"></nav>
  <main id="view"></main>
</div>
<div id="toast" class="toast" hidden></div>

<script>
"use strict";
/* ============ utilità data ============ */
const MONTHS=['Gennaio','Febbraio','Marzo','Aprile','Maggio','Giugno','Luglio','Agosto','Settembre','Ottobre','Novembre','Dicembre'];
const DOW=['Lun','Mar','Mer','Gio','Ven','Sab','Dom'];
const pad=n=>String(n).padStart(2,'0');
const iso=(y,m,d)=>y+'-'+pad(m+1)+'-'+pad(d);
const parse=s=>{const p=s.split('-').map(Number);return new Date(Date.UTC(p[0],p[1]-1,p[2]));};
const fmt=d=>d.getUTCFullYear()+'-'+pad(d.getUTCMonth()+1)+'-'+pad(d.getUTCDate());
const addDays=(s,n)=>{const d=parse(s);d.setUTCDate(d.getUTCDate()+n);return fmt(d);};
const dow=s=>(parse(s).getUTCDay()+6)%7;
const itDate=s=>s.slice(8)+'/'+s.slice(5,7)+'/'+s.slice(0,4);
const formDate=s=>s.slice(8)+'.'+s.slice(5,7)+'.'+s.slice(2,4);
const todayISO=()=>{const n=new Date();return iso(n.getFullYear(),n.getMonth(),n.getDate());};
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function eachDay(a,b){const out=[];let d=a;while(d<=b){out.push(d);d=addDays(d,1);}return out;}

function easter(y){
  const a=y%19,b=Math.floor(y/100),c=y%100,d=Math.floor(b/4),e=b%4,f=Math.floor((b+8)/25),g=Math.floor((b-f+1)/3);
  const h=(19*a+b-d-g+15)%30,i=Math.floor(c/4),k=c%4,l=(32+2*e+2*i-h-k)%7,m=Math.floor((a+11*h+22*l)/451);
  const mo=Math.floor((h+l-7*m+114)/31),da=((h+l-7*m+114)%31)+1;
  return iso(y,mo-1,da);
}
let hcache={};
function holidays(y){
  if(hcache[y])return hcache[y];
  const h={};const add=(m,d,n)=>{h[iso(y,m,d)]=n;};
  add(0,1,'Capodanno');add(0,6,'Epifania');add(3,25,'Liberazione');add(4,1,'Festa del lavoro');add(5,2,'Festa della Repubblica');
  add(7,15,'Ferragosto');add(10,1,'Ognissanti');add(11,8,'Immacolata');add(11,25,'Natale');add(11,26,'Santo Stefano');
  const e=easter(y);h[e]='Pasqua';h[addDays(e,1)]="Lunedì dell'Angelo";
  if(state.settings.patron){let d=1;while(dow(iso(y,8,d))!==0)d++;if(d===1)d=8;h[iso(y,8,d)]='Festa patronale';}
  hcache[y]=h;return h;
}
const holName=s=>holidays(+s.slice(0,4))[s];
const isWorking=s=>state.settings.workdays.includes(dow(s))&&!holName(s);
function hasWorkingBetween(a,b){let d=addDays(a,1);while(d<b){if(isWorking(d))return true;d=addDays(d,1);}return false;}
function wdBetween(a,b){let n=0,d=addDays(a,1);while(d<b){if(isWorking(d))n++;d=addDays(d,1);}return n;}

/* ============ tipi e causali (regolamento aziendale, p. 19) ============ */
const CAUSALI={
  1:'Inaccessibilità alla struttura',2:'Guasto macchina',3:'Indisponibilità del personale',4:'Indisponibilità materiale/dispositivi',
  5:'Assenze programmate (ferie, 104, congressi, aggiornamenti)',6:'Riprogrammazione agende',7:'Chiusura definitiva per riorganizzazione dei servizi'
};
const TYPES={
  ferie:{label:'Ferie',short:'F',causale:5,plan:true,counter:'ferie',motivo:'Ferie'},
  feriep:{label:'Ferie anni precedenti',short:'FP',causale:5,plan:true,counter:'feriep',motivo:'Ferie'},
  visita:{label:'Visite, terapie, esami (art. 37)',short:'VM',causale:5,plan:true,counter:'visite',motivo:'Permesso retribuito'},
  recupero:{label:'Ore a recupero (eccedenti maturate)',short:'RC',causale:5,plan:true,counter:'rec',motivo:'Permesso retribuito'},
  lutto:{label:'Lutto familiare (art. 33, 3 giorni per evento)',short:'LU',causale:5,plan:true,counter:'lutto',motivo:'Permesso retribuito'},
  fest:{label:'Festività soppresse',short:'S',causale:5,plan:true,counter:'fest',motivo:'Festività soppresse'},
  permesso:{label:'Permesso retribuito',short:'P',causale:5,plan:true,counter:'permessi',motivo:'Permesso retribuito'},
  congresso:{label:'Congresso / aggiornamento facoltativo (art. 33)',short:'C',causale:5,plan:true,counter:'agg',motivo:'Congresso/aggiornamento'},
  formazione:{label:'Formazione con le 4 ore settimanali (art. 45)',short:'FO',causale:5,plan:true,counter:'form',motivo:'Aggiornamento professionale'},
  l104:{label:'Legge 104',short:'104',causale:5,plan:true,counter:'l104',motivo:'L.104'},
  nc:{label:'Da classificare',short:'?',causale:5,plan:true,counter:'nc',motivo:'Assenza programmata'},
  malattia:{label:'Malattia',short:'M',causale:3,plan:false,motivo:'Malattia (indisponibilità personale)'},
  guasto:{label:'Guasto macchina',short:'G',causale:2,plan:false,motivo:'Guasto macchina'},
  struttura:{label:'Struttura inaccessibile',short:'I',causale:1,plan:false,motivo:'Inaccessibilità alla struttura'},
  materiale:{label:'Materiale/dispositivi non disponibili',short:'D',causale:4,plan:false,motivo:'Indisponibilità materiale dispositivo'},
  riprog:{label:'Riprogrammazione agenda',short:'R',causale:6,plan:false,motivo:'Riprogrammazione agende'}
};
const IMPREV=['malattia','guasto','struttura','materiale'];

/* ============ dati iniziali ============ */
const SEED_RANGES=[];
function seedEntries(){const e={};SEED_RANGES.forEach(r=>eachDay(r[0],r[1]).forEach(d=>{e[d]={type:'nc',booked:0};}));return e;}
function seedCongressi(){return [];}
function defaults(){
  return {v:1,
    settings:{periodFrom:'2027-07-01',periodTo:'2028-06-30',
      codes:[],
      workdays:[0,1,2,3,4,5],wdv:2,patron:true,motivoAll:true,
      typesOn:{ferie:true,feriep:true,visita:true,lutto:true,recupero:true,fest:true,permesso:true,congresso:true,formazione:true,l104:false,malattia:true,guasto:true,struttura:true,materiale:true,riprog:true},
      struttura:'',qualifica:'',nominativo:'',codReg:'',telefono:'',
      motivoMain:'Programmazione ferie e permessi retribuiti (congressi, visite mediche)',
      ent:{ferie:32,fest:4,agg:8,formOre:184,permessi:3,permessiUnit:'giorni',visiteOre:18,l104Month:0,yr:{}},entv:2},
    entries:seedEntries(),congressi:seedCongressi(),imported:true};
}
let state=defaults();
function purgeNW(){Object.keys(state.entries).forEach(d=>{if(!isWorking(d))delete state.entries[d];});}
purgeNW();
const view={tab:'cal',y:2027,m:6,anchor:null,end:null,includeNW:false,year:2027,msg:'',manual:'',resetStep:0};
view.y=+state.settings.periodFrom.slice(0,4);view.m=+state.settings.periodFrom.slice(5,7)-1;view.year=view.y;

/* ============ salvataggio ============ */
let store={mode:'local',ref:null},saveTimer=null,saving=false,dirty=false,downloads=null;
function setStatus(t){const el=document.getElementById('saveStatus');if(el)el.textContent=t;}
function save(){
  state.u=Date.now();dirty=true;setStatus('Modifiche non salvate');
  clearTimeout(saveTimer);saveTimer=setTimeout(flush,700);
}
async function flush(){
  if(saving){saveTimer=setTimeout(flush,400);return;}
  if(!dirty)return;dirty=false;saving=true;
  try{
    const payload=JSON.parse(JSON.stringify(state));
    if(store.mode==='db'&&store.ref){await store.ref.set({state:payload,savedAt:new Date().toISOString()});setStatus('Salvato online');}

function adopt(s){
  if(!s||!s.settings)return;
  s=JSON.parse(JSON.stringify(s));
  const needEnt=!(s.settings.entv>=2);
  const sp=(s.settings.ent||{}).permessi,needUnit=!((s.settings.ent||{}).permessiUnit);
  const d=defaults();
  state={...d,...s,settings:{...d.settings,...s.settings,ent:{...d.settings.ent,...((s.settings||{}).ent||{})},typesOn:{...d.settings.typesOn,...((s.settings||{}).typesOn||{})}}};
  if(needEnt){
    const o=(s.settings&&s.settings.ent)||{};
    if(!o.ferie&&!o.agg&&!o.permessi)state.settings.ent={...d.settings.ent};
    state.settings.entv=2;
  }
  if(needUnit){
    if(!sp||sp===18){state.settings.ent.permessiUnit='giorni';state.settings.ent.permessi=3;}
    else state.settings.ent.permessiUnit='ore';
  }
  if(!(state.settings.wdv>=2)){state.settings.workdays=[0,1,2,3,4,5];state.settings.wdv=2;}
  hcache={};purgeNW();
  view.y=+state.settings.periodFrom.slice(0,4);view.m=+state.settings.periodFrom.slice(5,7)-1;view.year=view.y;
}

/* ============ versione web: sincronizzazione con GitHub, backup, download ============ */
const SYNCK='ca-sync',SYNCF='agende.json',IS_WEB=!(window.claude&&window.claude.use);
let syncState={ok:null,at:0,msg:''},syncing=false,syncAgain=false,syncT=null;
function syncCfg(){try{return JSON.parse(localStorage.getItem(SYNCK)||'null');}catch(e){return null;}}
function setSyncCfg(c){try{if(c)localStorage.setItem(SYNCK,JSON.stringify(c));else localStorage.removeItem(SYNCK);}catch(e){}}
function syncInfo(){const c=syncCfg();if(!c)return 'Non attiva: i dati restano solo su questo dispositivo.';
  return 'Attiva su '+c.repo+(syncState.at?' · ultima sincronizzazione '+new Date(syncState.at).toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'')+(syncState.ok===false?' · errore: '+syncState.msg:'');}
const b64e=t=>{const by=new TextEncoder().encode(t);let bin='';for(let i=0;i<by.length;i+=0x8000)bin+=String.fromCharCode.apply(null,by.subarray(i,i+0x8000));return btoa(bin);};
const b64d=t=>new TextDecoder().decode(Uint8Array.from(atob(t.replace(/\s/g,'')),c=>c.charCodeAt(0)));
function ghReq(c,method,body){
  return fetch('https://api.github.com/repos/'+c.repo+'/contents/'+SYNCF+(method==='GET'?'?t='+Date.now():''),{method,cache:'no-store',
    headers:Object.assign({Authorization:'Bearer '+c.token,Accept:'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28'},body?{'Content-Type':'application/json'}:{}),
    body:body?JSON.stringify(body):undefined});
}
function syncSoon(){if(!IS_WEB||!syncCfg())return;clearTimeout(syncT);syncT=setTimeout(()=>syncNow(),2500);}
async function syncNow(manual){
  const c=syncCfg();if(!IS_WEB||!c)return;
  if(syncing){syncAgain=true;return;}
  syncing=true;
  try{
    for(let tent=0;tent<3;tent++){
      const r=await ghReq(c,'GET');let remote=null,sha,raw='';
      if(r.status===200){const j=await r.json();sha=j.sha;raw=b64d(j.content);try{remote=JSON.parse(raw);}catch(e){remote=null;}}
      else if(r.status!==404)throw new Error(r.status===401?'chiave non valida o scaduta':r.status===403?'permessi insufficienti sul repository':'risposta '+r.status);
      const lu=+state.u||0,ru=remote&&remote.state?(+remote.state.u||0):-1;
      if(remote&&remote.state&&ru>lu){
        adopt(remote.state);
        try{localStorage.setItem('calendario-agende',JSON.stringify(state));}catch(e){}
        render();break;
      }
      if(remote&&remote.state&&ru===lu)break;
      if(!lu)state.u=Date.now();
      const out=JSON.stringify({app:'calendario-agende',v:1,state:JSON.parse(JSON.stringify(state))});
      const put=await ghReq(c,'PUT',Object.assign({message:'Aggiornamento dati '+new Date().toISOString().slice(0,16),content:b64e(out)},sha?{sha}:{}));
      if(put.ok)break;
      if(put.status===409||put.status===422)continue;
      throw new Error('salvataggio non riuscito ('+put.status+')');
    }
    syncState={ok:true,at:Date.now(),msg:''};
    if(manual)toast('Dati sincronizzati');
    setStatus('Sincronizzato alle '+new Date().toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}));
  }catch(e){
    syncState={ok:false,at:syncState.at,msg:e.message||'errore di rete'};
    if(manual)toast('Sincronizzazione non riuscita: '+syncState.msg);
  }finally{syncing=false;if(syncAgain){syncAgain=false;syncSoon();}}
}
function webMode(){
  downloads={save:({filename,data})=>new Promise(res=>{
    const type=/\.csv$/.test(filename)?'text/csv;charset=utf-8':/\.json$/.test(filename)?'application/json':'text/html;charset=utf-8';
    const bl=new Blob([data],{type}),a=document.createElement('a');
    a.href=URL.createObjectURL(bl);a.download=filename;document.body.appendChild(a);a.click();
    setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();res();},500);
  })};
  if('serviceWorker' in navigator&&location.protocol.indexOf('http')===0)navigator.serviceWorker.register('sw.js').catch(()=>{});
  if(syncCfg())setTimeout(()=>syncNow(),800);
  document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&syncCfg())syncNow();});
}

/* ============ raggruppamenti e verifiche ============ */
function groups(from,to){
  const dates=Object.keys(state.entries).filter(d=>d>=from&&d<=to&&isWorking(d)).sort();const out=[];let cur=null;
  for(const d of dates){
    const e=state.entries[d],cls=e.type;
    if(cur&&cur.cls===cls&&!hasWorkingBetween(cur.end,d)){cur.end=d;cur.days.push(d);}
    else{cur={cls,start:d,end:d,days:[d]};out.push(cur);}
  }
  out.forEach(g=>{
    g.work=g.days.filter(isWorking);
    g.booked=g.days.reduce((a,d)=>a+(+state.entries[d].booked||0),0);
    g.types=[...new Set(g.days.map(d=>state.entries[d].type))];
  });
  return out;
}
function groupAt(day){
  const all=Object.keys(state.entries).sort();if(!all.length)return null;
  return groups(all[0],all[all.length-1]).find(g=>g.days.includes(day))||null;
}
function quarterKey(d){return d.slice(0,4)+'-T'+(Math.floor((+d.slice(5,7)-1)/3)+1);}
function imprevByQuarter(){
  const q={};
  Object.keys(state.entries).forEach(d=>{const e=state.entries[d];if(IMPREV.includes(e.type)&&isWorking(d)){const k=quarterKey(d);q[k]=(q[k]||0)+1;}});
  return q;
}
function verdictFor(g){
  const items=[],t0=todayISO(),first=g.start,plan=TYPES[g.cls].plan;
  const t=state.entries[first].type,cs=TYPES[t].causale;
  items.push({l:'info',t:'Causale da indicare: '+cs+'. '+CAUSALI[cs]+'.'});
  if(!g.work.length){
    items.push({l:'info',t:'Nessun giorno lavorativo in questo intervallo: non toglie offerta. Se non serve, puoi eliminarlo dal modulo.'});
  }else if(plan){
    if(first<t0){items.push({l:'info',t:'La data di inizio è già passata: preavviso non verificabile.'});}
    else{
      const n=wdBetween(t0,first);
      if(n>=7)items.push({l:'ok',t:'Preavviso di '+n+' giorni lavorativi (il regolamento ne chiede almeno 7).'});
      else if(g.work.length===1)items.push({l:'warn',t:'Preavviso di '+n+' giorni lavorativi. Per un solo giorno la riproiezione la fa l\'addetto agende del presidio: avvisalo subito.'});
      else items.push({l:'bad',t:'Preavviso di '+n+' giorni lavorativi: il regolamento ne chiede almeno 7. Anticipa la richiesta al dirigente medico referente agende.'});
    }
  }else{
    items.push({l:'info',t:'Evento non programmabile: nessun preavviso richiesto, ma registra la causale e sposta subito i pazienti già prenotati.'});
    const qs=imprevByQuarter(),k=quarterKey(first);
    if((qs[k]||0)>5)items.push({l:'warn',t:'In '+k+' hai '+qs[k]+' giorni lavorativi sospesi per cause non programmate. Il regolamento prevede 5 giorni lavorativi ogni tre mesi come margine di recupero: segnala la carenza alla direzione.'});
  }
  if(g.cls==='formazione')items.push({l:'info',t:'Ore dell\'art. 45: se le cumuli nell\'anno serve una particolare necessità di servizio e l\'intesa con il responsabile. Certifica attività e durata, anche con autocertificazione.'});
  if(g.work.length){
    if(g.booked>0)items.push({l:'warn',t:g.booked+' pazienti già prenotati: vanno spostati nel CUP a cura dell\'ambulatorio, con motivazione. Gli spostamenti non fatti rischiano di generare sanzioni errate ai pazienti.'});
    else items.push({l:'info',t:'Nessun paziente già prenotato indicato in questi giorni. Se ce ne sono, inserisci il numero nel dettaglio della selezione.'});
  }
  const win=state.settings;
  if(g.start<win.periodFrom||g.end>win.periodTo)items.push({l:'warn',t:'Parte dell\'intervallo è fuori dal periodo di proiezione ('+itDate(win.periodFrom)+' – '+itDate(win.periodTo)+').'});
  return items;
}
function motivoOf(g){return g.cls==='nc'?state.settings.motivoMain:TYPES[g.cls].motivo;}
function mainMotivo(gs){
  const w={};gs.forEach(g=>{const m=motivoOf(g);w[m]=(w[m]||0)+Math.max(1,g.work.length);});
  const k=Object.keys(w).sort((a,b)=>w[b]-w[a])[0];
  return k||state.settings.motivoMain;
}
function motivText(g){
  const labels=[...new Set(g.types.map(t=>TYPES[t].label.toLowerCase()))].join(', ');
  const cs=TYPES[state.entries[g.start].type].causale;
  const codes=state.settings.codes.map(c=>c.code).filter(Boolean);
  return (TYPES[state.entries[g.start].type].plan?'Assenza programmata':'Sospensione')+' ('+labels+') dal '+itDate(g.start)+' al '+itDate(g.end)+', agende '+codes.join(', ')+'. Causale '+cs+': '+CAUSALI[cs]+'.';
}
function counters(year){
  const c={lutto:0,visiteH:0,permessiH:0,recH:0,rec:0,ferie:0,feriep:0,visite:0,fest:0,permessi:0,agg:0,form:0,l104:0,nc:0};
  Object.keys(state.entries).forEach(d=>{
    if(d.slice(0,4)!==String(year)||!isWorking(d))return;
    const e=state.entries[d],k=TYPES[e.type].counter;if(k){if(e.h>0&&(k==='visite'||k==='permessi'||k==='rec'))c[k==='rec'?'recH':k+'H']+=+e.h;else c[k]++;}
    if(e.t2&&e.h2>0){const k2=TYPES[e.t2].counter;if(k2)c[k2==='rec'?'recH':k2+'H']+=+e.h2;}
  });
  return c;
}
function l104Months(year){

  Object.keys(state.entries).forEach(d=>{if(d.slice(0,4)===String(year)&&state.entries[d].type==='l104'&&isWorking(d)){const k=d.slice(5,7);m[k]=(m[k]||0)+1;}});
  return m;
}
function monthsInPeriod(){
  const out=[];let y=+state.settings.periodFrom.slice(0,4),m=+state.settings.periodFrom.slice(5,7)-1;
  const ey=+state.settings.periodTo.slice(0,4),em=+state.settings.periodTo.slice(5,7)-1;
  while(y<ey||(y===ey&&m<=em)){out.push([y,m]);m++;if(m>11){m=0;y++;}}
  return out;
}

function yrData(y){const E=state.settings.ent;return (E.yr&&E.yr[y])||{};}
function ferieAPof(y){
  const d=yrData(y);
  if(d.ferieAP!==undefined&&d.ferieAP!==null&&d.ferieAP!=='')return {v:+d.ferieAP||0,auto:false};
  const q=yrData(y-1);
  if(q.ferieAP!==undefined||q.ferieUsate!==undefined){
    const pc=counters(y-1),prev=ferieAPof(y-1).v;
    return {v:Math.max(0,Math.round((prev+state.settings.ent.ferie+state.settings.ent.fest-pc.ferie-pc.feriep-pc.fest-(+q.ferieUsate||0))*2)/2),auto:true};
  }
  return {v:0,auto:false};
}
function bar(label,used,tot,unit){
  if(!(tot>0))return '<div class="counter"><div>'+esc(label)+'</div><div class="hint">Spettanza da impostare</div><div class="mono">'+used+' '+unit+'</div></div>';
  const pct=Math.min(100,Math.round(used*100/tot)),cls=used>tot?'bad':(used>=tot*0.9?'warn':'');
  const rest=tot-used;
  return '<div class="counter"><div>'+esc(label)+'</div><div><div class="bar '+cls+'"><i style="width:'+pct+'%"></i></div></div><div class="mono">'+used+' / '+tot+' '+(rest<0?'<span class="chip bad">oltre di '+(-rest)+'</span>':'<span class="hint">restano '+rest+'</span>')+'</div></div>';
}

      +(live(c)?'<button class="btn small" data-act="cgcal" data-id="'+esc(c.id)+'">Segna come congresso nel calendario</button>':'<span class="hint">FAD: si segue quando vuoi, di solito senza sospendere l\'agenda</span>')
      +'<button class="btn small danger" data-act="cgdel" data-id="'+esc(c.id)+'">Togli</button></div></div>';
  });
  html+='<div class="card"><h3>Aggiungi un evento</h3><div class="cols"><label class="f">Titolo<input type="text" id="cg-title"></label><label class="f">Formato<select id="cg-mode"><option>Online live</option><option>FAD asincrona</option><option>Presenza</option><option>Misto</option></select></label>'
    +'<label class="f">Dal<input type="date" id="cg-from"></label><label class="f">Al<input type="date" id="cg-to"></label><label class="f">Crediti ECM<input type="text" id="cg-cred"></label><label class="f">Link<input type="text" id="cg-link" placeholder="https://"></label></div>'
    +'<button class="btn primary" data-act="cgadd">Aggiungi</button></div>';
  return html;
}
function renderImp(){
  const s=state.settings,e=s.ent;
  let codes=s.codes.map((c,i)=>'<tr><td><input type="text" data-set="codes.'+i+'.code" value="'+esc(c.code)+'" aria-label="Codice agenda"></td><td><input type="text" data-set="codes.'+i+'.desc" value="'+esc(c.desc)+'" aria-label="Descrizione"></td><td><input type="text" data-set="codes.'+i+'.comune" value="'+esc(c.comune)+'" aria-label="Comune"></td><td><input type="text" data-set="codes.'+i+'.sede" value="'+esc(c.sede)+'" aria-label="Sede"></td><td><button class="btn small danger" data-act="codedel" data-i="'+i+'" aria-label="Elimina agenda">×</button></td></tr>').join('');
  const wd=DOW.map((n,i)=>'<label style="display:inline-flex;gap:4px;align-items:center;margin-right:10px"><input type="checkbox" data-wd="'+i+'" '+(s.workdays.includes(i)?'checked':'')+'>'+n+'</label>').join('');
  let html='<h2>Impostazioni</h2>';
  const py=+s.periodFrom.slice(0,4),yrs=[];for(let y=2026;y<=2031;y++)yrs.push(y);
  const preset=(s.periodFrom===py+'-07-01'&&s.periodTo===(py+1)+'-06-30')?py:'';
  html+='<div class="card"><h3>Periodo di proiezione delle agende</h3><div class="hint">È il periodo che entra nel modulo, nei controlli e nei conteggi del mese.</div>'
    +'<label class="f">Anno di proiezione (da luglio a giugno)<select data-act="proj"><option value=""'+(preset===''?' selected':'')+'>Personalizzato</option>'+yrs.map(y=>'<option value="'+y+'"'+(preset===y?' selected':'')+'>Luglio '+y+' – giugno '+(y+1)+'</option>').join('')+'</select></label>'
    +'<div class="cols"><label class="f">Dal<input type="date" data-set="periodFrom" data-rerender="1" value="'+s.periodFrom+'"></label><label class="f">Al<input type="date" data-set="periodTo" data-rerender="1" value="'+s.periodTo+'"></label></div>'
    +'<h3 style="margin-top:10px">Giorni in cui l\'ambulatorio è aperto</h3><div>'+wd+'</div>'
    +'<label style="display:flex;gap:8px;align-items:center;margin-top:8px"><input type="checkbox" id="patron" '+(s.patron?'checked':'')+'> Festa patronale (primo lunedì di settembre; se il 1° settembre è lunedì, il secondo)</label></div>';
  html+='<div class="card"><h3>Motivo nel modulo</h3><label style="display:flex;gap:8px;align-items:center"><input type="checkbox" id="mall" '+(s.motivoAll?'checked':'')+'> Scrivi il motivo su ogni riga di sospensione</label><div class="hint">Se lo spegni, il motivo compare in riga solo quando è diverso da quello generale ("Motivo sospensione"), come indica il modulo.</div></div>';
  html+='<div class="card"><h3>Causali da usare</h3><div class="hint">Spunta solo quelle che ti servono: le altre spariscono da legenda e pulsanti. Una causale già usata nel calendario resta visibile finché ci sono giorni segnati.</div><div class="cols" style="margin-top:6px">'
    +Object.keys(TYPES).filter(k=>k!=='nc').map(k=>'<label style="display:flex;gap:8px;align-items:center;margin:4px 0"><input type="checkbox" data-ty="'+k+'" '+(s.typesOn[k]!==false?'checked':'')+'><span class="badge t-'+k+'">'+TYPES[k].short+'</span>'+esc(TYPES[k].label)+' <span class="hint">(causale '+TYPES[k].causale+')</span></label>').join('')
    +'</div></div>';
  html+='<div class="card"><h3>Agende</h3><div class="scroll"><table class="simple"><thead><tr><th>Codice</th><th>Descrizione</th><th>Comune</th><th>Sede</th><th></th></tr></thead><tbody>'+codes+'</tbody></table></div><button class="btn small" data-act="codeadd" style="margin-top:8px">Aggiungi agenda</button></div>';
  html+='<div class="card"><h3>Spettanze annue</h3><div class="cols">'
    +'<label class="f">Ferie (giorni lavorativi)<input type="number" min="0" data-set="ent.ferie" data-num="1" value="'+e.ferie+'"></label>'
    +'<label class="f">Festività soppresse<input type="number" min="0" data-set="ent.fest" data-num="1" value="'+e.fest+'"></label>'
    +'<label class="f">Congressi, esami e aggiornamento, art. 33 (giorni l\'anno)<input type="number" min="0" data-set="ent.agg" data-num="1" value="'+e.agg+'"></label>'
    +'<label class="f">Formazione con le 4 ore settimanali, art. 45 (ore l\'anno: 4 × settimane lavorate)<input type="number" min="0" data-set="ent.formOre" data-num="1" value="'+e.formOre+'"></label>'
    +'<label class="f">Permessi per motivi personali: conta in<select data-act="permunit"><option value="giorni"'+(e.permessiUnit==='ore'?'':' selected')+'>giornate (3 l\'anno)</option><option value="ore"'+(e.permessiUnit==='ore'?' selected':'')+'>ore (18 l\'anno)</option></select></label>'
    +'<label class="f">Permessi personali ('+(e.permessiUnit==='ore'?'ore':'giornate')+' l\'anno)<input type="number" min="0" data-set="ent.permessi" data-num="1" value="'+e.permessi+'"></label>'
    +'<label class="f">Legge 104, giorni al mese (0 se non serve)<input type="number" min="0" data-set="ent.l104Month" data-num="1" value="'+e.l104Month+'"></label></div><div class="hint">Valori dal CCNL 2019-2021; lascia 0 dove non vuoi il controllo.</div></div>';
  html+='<div class="card"><h3>Dati per il modulo</h3><div class="cols">'
    +'<label class="f">Struttura<input type="text" data-set="struttura" value="'+esc(s.struttura)+'"></label>'
    +'<label class="f">Qualifica<input type="text" data-set="qualifica" value="'+esc(s.qualifica)+'"></label>'
    +'<label class="f">Nominativo<input type="text" data-set="nominativo" value="'+esc(s.nominativo)+'"></label>'
    +'<label class="f">Codice regionale<input type="text" data-set="codReg" value="'+esc(s.codReg)+'"></label>'
    +'<label class="f">Riferimento telefonico<input type="text" data-set="telefono" value="'+esc(s.telefono)+'"></label></div>'
    +'<label class="f">Motivo per i giorni ancora "Da classificare" (negli altri casi il motivo si compila da solo in base al tipo)<textarea data-set="motivoMain" rows="2">'+esc(s.motivoMain)+'</textarea></label></div>';
  if(IS_WEB)html+=renderSync();
  html+='<div class="card"><h3>Dati</h3><div class="hint">I dati si salvano solo per chi apre la pagina (online se è collegato all\'account, altrimenti su questo dispositivo).</div><div class="row" style="margin-top:8px">'
    +(view.resetStep===0?'<button class="btn danger" data-act="reset1">Ripristina i dati iniziali</button>':'<span class="chip bad">Sicura?</span><button class="btn danger" data-act="reset2">Sì, cancella e ripristina</button><button class="btn" data-act="reset0">Annulla</button>')
    +'</div></div>';
  return html;
}

/* ============ azioni ============ */
function toast(t){const el=document.getElementById('toast');el.textContent=t;el.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>{el.hidden=true;},2600);}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast('Copiato');view.manual='';return true;}
  catch(e){view.manual=t;render();toast('Copia a mano dal riquadro in fondo');return false;}
}
function setPath(path,val){
  const p=path.split('.');let o=state.settings;
  for(let i=0;i<p.length-1;i++)o=o[p[i]];
  o[p[p.length-1]]=val;
}
function parseHrs(v){v=String(v||'').trim().replace(',','.');if(!v)return 0;if(v.indexOf(':')>-1){const a=v.split(':');return Math.round(((+a[0]||0)+(+a[1]||0)/60)*100)/100;}return Math.round((+v||0)*100)/100;}
function applyType(type){
  const sel=selDays();if(!sel.length)return;
  const target=sel;
  if(!target.length){toast('Nessun giorno lavorativo selezionato');return;}
  const bk=document.getElementById('booked'),n=Math.max(0,parseInt(bk&&bk.value,10)||0);
  const hv=parseHrs((document.getElementById('hrs')||{}).value),t2=(document.getElementById('t2')||{}).value||'';
  const hourly=['visita','permesso','recupero'].includes(type);
  target.forEach((d,i)=>{const en={type,booked:i===0?n:0};
    if(hourly&&hv>0&&hv<6.34){en.h=hv;if(t2&&t2!==type){en.t2=t2;en.h2=Math.round((6.333-hv)*100)/100;}}
    state.entries[d]=en;});
  state.imported=Object.values(state.entries).some(e=>e.type==='nc');
  save();render();
  toast(target.length+(target.length===1?' giorno segnato come ':' giorni segnati come ')+TYPES[type].label);
}
function clearDays(){
  const sel=selDays().filter(d=>state.entries[d]);
  if(!sel.length){toast('Nessun segno da togliere nei giorni selezionati');return;}
  sel.forEach(d=>{delete state.entries[d];});
  state.imported=Object.values(state.entries).some(e=>e.type==='nc');
  hcache={};save();render();
  toast(sel.length+(sel.length===1?' giorno liberato':' giorni liberati'));
}
function download(name,data,label){
  if(!downloads)return;
  downloads.save({filename:name,data}).then(()=>toast(label+' salvato')).catch(err=>{if(!err||err.code!=='declined')toast('Download non riuscito');});
}
function printableDoc(){
  return '<!DOCTYPE html><html lang="it"><head><meta charset="utf-8"><title>Riproiezione / Sospensione agende</title><style>@page{size:A4;margin:14mm}body{font:13px/1.35 "Times New Roman",serif;color:#111;margin:0}h4{text-align:center;font-size:18px;margin:8px 0 12px}.meta{display:flex;justify-content:space-between;font-size:12px}table{border-collapse:collapse;width:100%;margin:4px 0 14px}th,td{border:1px solid #111;padding:3px 6px;font-size:12px;vertical-align:top}th{text-align:center}.lab{font-weight:700;margin:6px 0 2px}.reasons{font-size:11px}.stamp{font-size:11px;text-align:center;margin:10px auto;max-width:300px}.sig{display:flex;justify-content:space-between;gap:20px;margin-top:18px}.sig div{min-width:220px}.line{border-bottom:1px solid #111;height:22px;margin-top:2px}tr{page-break-inside:avoid}</style></head><body>'+formHTML()+'</body></html>';
}
function csvText(){
  const s=state.settings,codes=s.codes.filter(c=>c.code).map(c=>c.code).join(' ');
  const q=v=>'"'+String(v).replace(/"/g,'""')+'"';
  return ['Codice Agenda;Comune;Sede;Dal;Al;Motivo'].concat(groups(s.periodFrom,s.periodTo).map(g=>[q(codes),'""','""',formDate(g.start),formDate(g.end),q(motivoOf(g))].join(';'))).join('\n');
}

document.addEventListener('click',ev=>{try{clickHandler(ev);}catch(e){toast('Errore: '+(e&&e.message?e.message:e));}});
function clickHandler(ev){
  const t0=ev.target&&ev.target.closest?ev.target:(ev.target&&ev.target.parentElement);
  const b=t0&&t0.closest('[data-act]');if(!b)return;
  const a=b.dataset.act;
  if(a==='tab'){view.tab=b.dataset.tab;render();window.scrollTo(0,0);}
  else if(a==='prev'){view.m--;if(view.m<0){view.m=11;view.y--;}render();}
  else if(a==='next'){view.m++;if(view.m>11){view.m=0;view.y++;}render();}
  else if(a==='gotoday'){const t=todayISO();view.y=+t.slice(0,4);view.m=+t.slice(5,7)-1;render();}
  else if(a==='goperiod'){view.y=+state.settings.periodFrom.slice(0,4);view.m=+state.settings.periodFrom.slice(5,7)-1;render();}
  else if(a==='day'){
    const d=b.dataset.day;
    if(!isWorking(d))return;
    if(!view.anchor||view.end){view.anchor=d;view.end=null;}
    else{view.end=d;}
    render();
  }
  else if(a==='apply')applyType(b.dataset.type);
  else if(a==='clear')clearDays();
  else if(a==='savebooked'){
    const sel=selDays().filter(d=>state.entries[d]);if(!sel.length)return;
    const n=Math.max(0,parseInt(document.getElementById('booked').value,10)||0);
    sel.forEach((d,i)=>{state.entries[d].booked=i===0?n:0;});save();render();toast('Numero salvato');
  }
  else if(a==='rqsave'||a==='rqmark'){
    const g=id=>(document.getElementById(id)||{}).value||'';
    const r={id:'r'+Date.now(),from:g('rq-from'),to:g('rq-to'),type:g('rq-type')||'ferie',stato:'bozza'};
    view.rq={from:r.from,to:r.to,type:r.type};
    if(!r.from||!r.to||r.from>r.to){toast('Controlla le date: Dal deve essere prima di Al');render();return;}
    const days=rqDays(r.from,r.to);if(!days.length){toast('Nel periodo non ci sono giorni lavorativi');return;}
    state.richieste=state.richieste||[];state.richieste.push(r);
    if(a==='rqmark'){days.forEach(d=>{state.entries[d]={type:r.type,booked:0};});state.imported=Object.values(state.entries).some(e=>e.type==='nc');}
    save();render();toast('Richiesta salvata ('+days.length+' giorni)');return;
  }
  else if(a==='rqdel'){state.richieste=(state.richieste||[]).filter(r=>r.id!==b.dataset.id);save();render();return;}
  else if(a==='remove'){selDays().forEach(d=>{delete state.entries[d];});state.imported=Object.values(state.entries).some(e=>e.type==='nc');save();render();}
  else if(a==='clearsel'){view.anchor=null;view.end=null;render();}
  else if(a==='gocal'){const d=b.dataset.day;view.tab='cal';view.y=+d.slice(0,4);view.m=+d.slice(5,7)-1;view.anchor=d;view.end=null;render();window.scrollTo(0,0);}
  else if(a==='copymot'){const g=groups(state.settings.periodFrom,state.settings.periodTo)[+b.dataset.i];if(g)copyText(motivText(g));}
  else if(a==='copyform')copyText(formText());
  else if(a==='dlhtml')download('sospensione-agende.html',printableDoc(),'File');
  else if(a==='dlcsv')download('sospensione-agende.csv',csvText(),'File');
  else if(a==='syncsave')saveSyncForm();
  else if(a==='syncnow')syncNow(true).then(()=>render());
  else if(a==='syncoff'){setSyncCfg(null);toast('Sincronizzazione disattivata');render();}
  else if(a==='bkexp')exportBackup();
  else if(a==='cgcal'){
    const c=state.congressi.find(x=>x.id===b.dataset.id);if(!c)return;
    const days=eachDay(c.from,c.to).filter(isWorking);
    if(!days.length){toast('Nessun giorno lavorativo in queste date');return;}
    days.forEach((d,i)=>{state.entries[d]={type:'congresso',booked:i===0?0:0};});
    state.imported=Object.values(state.entries).some(e=>e.type==='nc');
    save();toast(days.length+' giorni segnati come congresso');
    view.tab='cal';view.y=+c.from.slice(0,4);view.m=+c.from.slice(5,7)-1;view.anchor=days[0];view.end=days[days.length-1];render();window.scrollTo(0,0);
  }
  else if(a==='cgdel'){state.congressi=state.congressi.filter(x=>x.id!==b.dataset.id);save();render();}
  else if(a==='cgadd'){
    const g=id=>document.getElementById(id).value.trim();
    const title=g('cg-title'),from=g('cg-from'),to=g('cg-to')||from;
    if(!title||!from){toast('Servono almeno titolo e data di inizio');return;}
    state.congressi.push({id:'c'+Date.now(),title,from,to,mode:g('cg-mode'),cred:g('cg-cred'),link:g('cg-link'),note:''});
    save();render();toast('Evento aggiunto');
  }
  else if(a==='codeadd'){state.settings.codes.push({code:'',desc:'Come previsto da ultimo calendario proiettato',comune:'',sede:''});save();render();}
  else if(a==='codedel'){state.settings.codes.splice(+b.dataset.i,1);save();render();}
  else if(a==='reset1'){view.resetStep=1;render();}
  else if(a==='reset0'){view.resetStep=0;render();}
  else if(a==='reset2'){state=defaults();hcache={};purgeNW();view.resetStep=0;view.anchor=null;view.end=null;view.y=2027;view.m=6;view.year=2027;save();render();toast('Dati ripristinati');}
}
document.addEventListener('change',ev=>{
  const t=ev.target;
  if(t.id==='bkfile'){importBackup(t.files&&t.files[0]);t.value='';return;}
  if(t.dataset.act==='year'){view.year=+t.value;render();return;}
  if(t.id==='rq-from'||t.id==='rq-to'||t.id==='rq-type'){const g=id=>(document.getElementById(id)||{}).value||'';view.rq={from:g('rq-from'),to:g('rq-to'),type:g('rq-type')||'ferie'};render();return;}
  if(t.dataset.act==='rqstato'){const r=(state.richieste||[]).find(x=>x.id===t.dataset.id);if(r){r.stato=t.value;save();}return;}
  if(t.dataset.act==='permunit'){state.settings.ent.permessiUnit=t.value;state.settings.ent.permessi=t.value==='ore'?18:3;save();render();return;}
  if(t.dataset.act==='proj'){
    if(t.value){const y=+t.value;state.settings.periodFrom=y+'-07-01';state.settings.periodTo=(y+1)+'-06-30';hcache={};view.y=y;view.m=6;view.year=y;save();render();toast('Periodo: luglio '+y+' – giugno '+(y+1));}
    return;
  }
  if(t.dataset.ty){state.settings.typesOn[t.dataset.ty]=t.checked;save();render();return;}
  if(t.id==='mall'){state.settings.motivoAll=t.checked;save();render();return;}
  if(t.id==='patron'){state.settings.patron=t.checked;hcache={};save();render();return;}
  if(t.dataset.wd!==undefined){
    const i=+t.dataset.wd,set=new Set(state.settings.workdays);t.checked?set.add(i):set.delete(i);
    state.settings.workdays=[...set].sort();save();render();return;
  }
  if(t.dataset.yr){
    let v=t.value.trim().replace(',','.');
    if((t.dataset.yr==='permOre'||t.dataset.yr==='visOre'||t.dataset.yr==='creditoAP')&&v.indexOf(':')>-1){const q=v.split(':');v=(parseInt(q[0],10)||0)+(parseInt(q[1],10)||0)/60;}
    v=Math.max(0,parseFloat(v)||0);
    const E=state.settings.ent;E.yr=E.yr||{};E.yr[view.year]=E.yr[view.year]||{};E.yr[view.year][t.dataset.yr]=v;
    save();render();return;
  }
  if(t.dataset.set){
    let v=t.value;if(t.dataset.num)v=Math.max(0,parseInt(v,10)||0);
    setPath(t.dataset.set,v);save();
    if(t.dataset.rerender){hcache={};render();}
  }
});

setStatus('Pronto');
render();
initStore();
</script>
