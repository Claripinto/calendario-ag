name: Pubblica pagina
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths:
      - index.html
      - sw.js
      - manifest.webmanifest
      - icon-*.png
      - .github/workflows/pubblica.yml
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.dep.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/configure-pages@v5
      - run: mkdir site && cp index.html sw.js manifest.webmanifest icon-*.png site/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site
      - id: dep
        uses: actions/deploy-pages@v4
